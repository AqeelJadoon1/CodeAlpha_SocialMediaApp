<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - Social App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
    header { background: #222; color: white; padding: 16px 24px; }
    header a { color: white; text-decoration: none; }
    .wrap { max-width: 500px; margin: 24px auto; }
    .card { background: white; border-radius: 8px; padding: 20px; text-align: center; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 12px 0; }
    .stats div { text-align: center; }
    .stats b { display: block; font-size: 18px; }
    button { padding: 8px 20px; background: #222; color: white; border: 0;
              border-radius: 4px; cursor: pointer; }
    .following-btn { background: #c0392b; }
    .post { background: white; border-radius: 8px; padding: 16px; margin-top: 12px; }
  </style>
</head>
<body>
  <header><a href="/"><h1>Social App</h1></a></header>
  <div class="wrap">
    <div class="card" id="profile">Loading...</div>
    <div id="posts"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('id');
    let me = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadProfile() {
      const meRes = await fetch('/api/me');
      me = await meRes.json();

      const response = await fetch('/api/users/' + profileId);
      if (!response.ok) {
        document.getElementById('profile').textContent = 'User not found';
        return;
      }
      const user = await response.json();

      let followBtn = '';
      if (me && me.id != profileId) {
        followBtn = `
          <button id="follow-btn" class="${user.followed_by_me ? 'following-btn' : ''}"
                  data-following="${user.followed_by_me}">
            ${user.followed_by_me ? 'Following' : 'Follow'}
          </button>`;
      }

      document.getElementById('profile').innerHTML = `
        <h2>${user.name}</h2>
        <p>${user.bio ? escapeHtml(user.bio) : 'No bio yet.'}</p>
        <div class="stats">
          <div><b>${user.post_count}</b>Posts</div>
          <div><b>${user.follower_count}</b>Followers</div>
          <div><b>${user.following_count}</b>Following</div>
        </div>
        ${followBtn}
      `;

      const btn = document.getElementById('follow-btn');
      if (btn) {
        btn.onclick = async () => {
          const following = btn.dataset.following === '1' || btn.dataset.following === 'true';
          const method = following ? 'DELETE' : 'POST';
          await fetch(`/api/users/${profileId}/follow`, { method });
          loadProfile(); // refresh counts and button state
        };
      }
    }

    async function loadUserPosts() {
      const response = await fetch('/api/posts');
      const posts = await response.json();
      const mine = posts.filter(p => p.author_id == profileId);

      const container = document.getElementById('posts');
      container.innerHTML = mine
        .map(p => `
          <div class="post">
            <div>${escapeHtml(p.content)}</div>
            <small>❤ ${p.like_count} · 💬 ${p.comment_count}</small>
          </div>`)
        .join('') || '<p style="text-align:center;">No posts yet.</p>';
    }

    loadProfile();
    loadUserPosts();
  </script>
</body>
</html>
